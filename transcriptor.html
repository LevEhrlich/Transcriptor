function insertSymbolAtCursor(s) {
    console.log("insertSymbol started: c=", s);
	//txt.focus();
    
    const selection = window.getSelection();
    if (!selection.rangeCount) return;
	console.log("selection.rangeCount=",selection.rangeCount);
    const range = selection.getRangeAt(0);

    // Вставка символа в позицию курсора
    range.deleteContents();
    const textNode = document.createTextNode(s);
    range.insertNode(textNode);
    
    // Перемещение курсора после вставленного символа
    range.setStartAfter(textNode);
    range.setEndAfter(textNode);
    selection.removeAllRanges();
    selection.addRange(range);
    if(framelet) console.log("insertSymbol finishes: framelet.id=", framelet.id);
}

function applyStyle(command, value) {
  //console.log("applyStyle started: command=", command, ", value=", value);
  const selection = window.getSelection();
  console.log("applyStyle: selection.rangeCount=", selection.rangeCount);
  if (!selection.rangeCount) return;
            
  const range = selection.getRangeAt(0);
  const span = document.createElement('span');
  console.log("applyStyle: range=",range);          
  if (command === 'line-through') {
     span.style.textDecoration="line-through"
    } else if (command === 'italic') {
     span.style.fontStyle = 'italic';
    } else if (command === 'normal') {
     span.style.fontStyle='normal';
    } else if (command === 'underline') {
     span.style.textDecoration = 'underline';
	 span.style.textDecorationStyle="dashed";
	} else if (command==='overline') {
	 span.style.textDecoration='overline'
	} 
	else if (command === 'foreColor') {
     span.style.color = value;
    } else if (command === 'backColor') {
      span.style.backgroundColor = value;
    } else if(command==='none'){
	  span.style.textDecoration='none';
	  span.style.textDecorationLine='';
	  span.style.textDecoration='';
	  document.execCommand('underline', false, null);
	  //document.execCommand('overline', false, null);
	  //document.execCommand('line-through', false, null);
	}
  range.surroundContents(span);
  selection.removeAllRanges();
  selection.addRange(range);
  framelet.p.innerHTML=txt.innerHTML;
  framelet2.p.innerHTML=txt.innerHTML;
  console.log("applyStyle finishes: framelet.id=", framelet.id);
}

function copyStyles(source, target) {
  const sourceStyles = window.getComputedStyle(source);
  for (const style of sourceStyles) {
    target.style.setProperty(style, sourceStyles.getPropertyValue(style), sourceStyles.getPropertyPriority(style));
  }
} //copyStyles

function addListenersForFramelet() { 
for(let j=0;(j<frameletA.length) && frameletA[j];j++) { 
  if(!frameletA[j]) continue;
  let elt=frameletA[j];
  if(!elt.mouseenter){
    //console.log("j=",j,", elt.mouseenter=", elt.mouseenter);
  
  elt.addEventListener("mouseenter",function(e) {
    //console.log("framelet.mouseenter: e.target.id=", e.target.id);
	if(borderVisibility=="focused"||borderVisibility=="always")
	  e.target.style.border="1px solid blue";
    else e.target.style.borderColor="transparent";
	if(!elt.phi) elt.phi=0; curPhi=elt.phi;
	console.log("curPhi=",curPhi);
	if(laserFrame) {elt.style.border="1px solid red"; 
	  let k=frameletA.indexOf(elt); framelet2A[k].style.border="1px solid red";
	}
	frltContent.innerText=elt.p.innerText; 
  });
  elt.mouseenter=1;  	
  } //else {console.log("j=",j,", elt.mouseenter=", elt.mouseenter);}
		  
  if(!elt.mouseleave){
  elt.addEventListener("mouseleave",function(e) {
  //console.log("framelet.mouseleave: e.target.id=",e.target.id);
  if(elt!=Ed.framelet && borderVisibility!="always") e.target.style.borderColor="transparent";
  if(elt==Ed.framelet) e.target.style.border="1px solid blue";
  if(elt!=Ed.framelet && borderVisibility=="always") e.target.style.border="1px solid blue";  
  if(laserFrame){let k; 
  elt.style.border="1px solid transparent";
  k=frameletA.indexOf(elt); 
    if(k) { 
      frameletA[k].style.border="1px solid transparent"; framelet2A[k].style.border="1px solid transparent";
	 }
  }  
  frltContent.innerText="";  
});
  elt.mouseleave=1;
  } //else elt.mouseleave=1;
		  
  if(!elt.mousedown){		  
  elt.addEventListener("mousedown",function(e){ 
   e.preventDefault();		  
  });
  elt.mousedown=1;
  } //else elt.mousedown=1;
		  
  if(!elt.mouseup){
  elt.addEventListener("mouseup",function(e) {
   e.preventDefault();
  });
  elt.mouseup=1;
  }// else elt.mouseup=1;
		  
  if(!elt.mousemove){
  elt.addEventListener("mousemove",function(e){ 
   e.preventDefault();
  }); 
  elt.mousemove=1;
  } //else elt.mousemove=1;

  if(!elt.wheel){
  elt.addEventListener("wheel", function(e){
		    //console.log("elt wheel handler");
			e.preventDefault();
  });
  elt.wheel=1;
  } //else elt.wheel=1;
  if(!elt.p.wheel){
  elt.p.addEventListener("wheel",function(e){
    //console.log("wheel elt.id=", elt.id, ", e.target.tagName=",e.target.tagName);
    e.preventDefault();
    
	return;
  });	
  elt.p.wheel=1;
  } //else elt.p.wheel=1;  
		  
  if(!elt.dblclick){
  elt.addEventListener("dblclick", function(e){
  e.preventDefault();
  //console.log("dblclick.started, framelet.id=", framelet.id);
  //framelet.style.borderWidth="0px";
  if(e.target.className=="frameletClass") framelet=e.target;
  else if (e.target.parentNode.className=="frameletClass") framelet=e.target.parentNode;
  else if(e.target.parentNode.parentNode.className=="frameletClass") framelet=e.target.parentNode.parentNode;
  else if(e.target.parentNode.parentNode.parentNode.className=="frameletClass") 
    framelet=e.target.parentNode.parentNode.parentNode;
  else alert("Не определяется framelet");
  Ed.framelet=framelet;
  let k=frameletA.indexOf(framelet);

  //console.log("dblclick before txt: framelet.id=", framelet.id);
  txt.innerHTML=framelet.p.innerHTML;

  //console.log("dblclick after txt: e.target.id=", e.target.id, ", e.target.parentNode.id=", e.target.parentNode.id,

	trans.style.zIndex=0;
	scan.style.zIndex=1;

	divScan.scale=2;

	divScan.scale=1;

   json = JSON.stringify(frameletA);
   console.log("after stringify: json.length=",json.length);
   const blob = new Blob([json], { type: 'application/json' });
   const url = URL.createObjectURL(blob);
   const a = document.createElement('a');
   a.href = url;
   a.download = 'data.json';
   document.body.appendChild(a);

   URL.revokeObjectURL(url);
};

function resizeText(container,innerSpan) {
  let containerWidth = container.offsetWidth;
  let containerHeight = container.offsetHeight;
  
  // Create a temporary element to measure text size
  let tempElement = document.createElement('span');
  tempElement.style.position = 'absolute';
  tempElement.style.visibility = 'hidden';
  tempElement.style.whiteSpace = 'nowrap';
  document.body.appendChild(tempElement);

  tempElement.innerHTML=innerSpan.innerHTML;
  let textWidth = tempElement.offsetWidth;
  let textHeight = tempElement.offsetHeight;

  // Calculate scale factors
  let scaleX = containerWidth / textWidth;
  let scaleY = containerHeight / textHeight;

  // Apply the transform
  innerSpan.style.transform = "scale("+scaleX+","+scaleY+")"; //scale(${scale});
  innerSpan.style.transformOrigin = 'top left';
  // Remove the temporary element
  document.body.removeChild(tempElement);
  //delete tempElement;
}

function getStyledLines(element) {
  const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null);
  const lines = [];

  const rectMap = new Map();

  while (walker.nextNode()) {
    const node = walker.currentNode;

    for (let i = 0; i < node.length; i++) {
      const range = document.createRange();
      range.setStart(node, i);
      range.setEnd(node, i + 1);

      const rects = range.getClientRects();
      for (const rect of rects) {
        const key = `${Math.round(rect.top)}-${Math.round(rect.height)}`;

        if (!rectMap.has(key)) rectMap.set(key, []);
        rectMap.get(key).push(range.cloneContents());
      }

      range.detach();
    }
  }

  // Convert document fragments into HTML strings
  for (const [, fragments] of rectMap) {
    const container = document.createElement("div");
    fragments.forEach(frag => container.appendChild(frag));
    lines.push({
      html: container.innerHTML,
      text: container.innerText
    });
  }

  // Optional: sort lines by visual order (top to bottom)
  return lines.sort((a, b) => a.top - b.top);
}
